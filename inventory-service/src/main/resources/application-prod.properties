# ---------------------------------------------------------------------------
# prod — deployed profile (Render + Aiven).
# ---------------------------------------------------------------------------

# On Render each service is a separate public HTTPS hostname, so Eureka has to
# advertise that hostname rather than the container's private IP. This is the
# mirror image of the local default (prefer-ip-address=true in
# application.properties), which is what a caller inside one Docker network
# wants and what a caller across Render's network cannot use: an advertised
# 172.x address resolves to nothing outside the container it came from.
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME}
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE}