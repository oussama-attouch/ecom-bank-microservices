services:
  # ---------------------------------------------------------------------------
  # Postgres 16 for ledger-service — the one service in the stack that does not
  # use H2. Port 5433, not 5432, because a host Postgres often already owns 5432.
  #
  # The credentials here are the same literals ledger-service falls back to in
  # application.properties (`jdbc:postgresql://localhost:5433/ledger_db`, user
  # and password `ledger`), so the service connects with no overrides at all.
  # Keep the two in step: changing a value here without changing the fallback
  # there turns a working stack into a `SQL State: 08001` on startup.
  #
  # The named volume is the point of declaring this here rather than running
  # `docker run` by hand. Without one, Postgres keeps its data in the container's
  # writable layer and `docker compose down` destroys a seeded ledger, which
  # costs a full reseed (the portfolio mode writes ~40,000 transactions) to get
  # back.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger_db
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    # ledger-service runs Flyway before it finishes starting, so a Postgres that
    # is still initialising its cluster reads as a connection failure and the
    # service exits. This lets `docker compose up -d --wait` mean what it says.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: -Xms64M -Xmx128M
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # DEV ONLY — never use OVERWRITE_EXISTING in production.
      # NOTE (verified on Keycloak 26.0.8): `docker-compose restart keycloak` still
      # skips the import when the realm already exists ("Realm 'ecom-bank' already
      # exists. Import skipped" / Strategy: IGNORE_EXISTING), so it does NOT pick up
      # realm-export.json changes. Recreate the container to apply them:
      #   docker-compose up -d --force-recreate keycloak
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.strategy=OVERWRITE_EXISTING"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - kafka

volumes:
  ledger-postgres-data:
