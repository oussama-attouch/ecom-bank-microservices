spring.application.name=gateway-service
server.port=8888
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/ecom-bank
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/ecom-bank/protocol/openid-connect/certs

# ---------------------------------------------------------------------------
# Backoffice (specs/002-backoffice.md)
# ---------------------------------------------------------------------------
# Off by default. With the flag off, BackofficeUserController and
# KeycloakAdminClient are never created, /backoffice/** has no handler (so a
# manager gets 404, and everyone else is stopped at 403 by SecurityConfig), and
# no credential is read at all.
#
# Turning the flag on without a secret fails startup on purpose: an admin
# surface that starts broken answers 500 on every call and reads as a bug.
backoffice.users.enabled=true
backoffice.keycloak.base-url=http://localhost:8180
backoffice.keycloak.realm=ecom-bank
backoffice.keycloak.client-id=ecom-backoffice
# Dev-only credential, kept in step with keycloak/realm-export.json. Override
# with BACKOFFICE_KEYCLOAK_CLIENT_SECRET outside local development; this value
# is committed, so it must never be a production secret.
backoffice.keycloak.client-secret=backoffice-secret

# ---------------------------------------------------------------------------
# Actuator / Micrometer (specs/005-observability-resilience.md)
# ---------------------------------------------------------------------------
# Allow-list, never "*": heapdump/loggers/env/configprops are excluded on purpose
# (heapdump and loggers are write-capable, and neither Prometheus nor a probe
# needs them). Details need an authorised principal; SecurityConfig already
# permitAlls /actuator/**, so health details here could be read by anyone with a
# route to the edge — "when-authorized" with no principal keeps them closed, and
# HEALTH_SHOW_DETAILS=always opts in locally.
#
# This is the one service whose /actuator/** is reachable from outside: the
# gateway is the public edge. Scraping it is fine on a private network, but in a
# real deployment the management endpoints belong on their own interface —
# `management.server.port=${MANAGEMENT_PORT:${server.port}}` (note that moving it
# means every probe and the scrape target move with it), or a network policy that
# admits only the Prometheus host.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.info.env.enabled=true
info.app.name=${spring.application.name}
# Buckets, not client-side percentiles: percentiles cannot be pooled across
# instances, histogram buckets can (histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s

# ---------------------------------------------------------------------------
# Kubernetes probes (specs/005-observability-resilience.md, step 2)
# ---------------------------------------------------------------------------
# Own listener for management traffic. NOTE: the gateway's *application* port
# stays 8888 (ecom-frontend/proxy.conf.json and the Eureka registration both
# depend on it); the 8080/8081 edge split needs a coordinated change to
# proxy.conf.json, and 8081 collides with customer-service on this host.
app.management-port=${MGMT_PORT:18888}
management.server.port=${app.management-port}
# Published to Eureka so the gateway's aggregator probes the bound port; one
# source of truth prevents the server and the advert from drifting.
eureka.instance.metadata-map[management.port]=${app.management-port}
management.endpoint.health.probes.enabled=true
# Downtime in Keycloak or Eureka must not restart the gateway: the JWKS and the
# Eureka registry are both cached, so a restarted pod serves nothing that a
# running one could not.
management.endpoint.health.group.liveness.include=livenessState,ping
# Readiness is application state only. Keycloak is deliberately absent: a pod
# that cannot refresh JWKS still validates every token already cached, and
# pulling the whole edge out of rotation on a Keycloak blip converts a partial
# identity outage into a total one.
management.endpoint.health.group.readiness.include=readinessState

# ---------------------------------------------------------------------------
# Gateway active health checks (specs/005-observability-resilience.md, step 4)
# ---------------------------------------------------------------------------
# SHIPPED DISABLED. This is a deliberate deviation from the approval and it is
# the one place the two rulings collide; the reason is mechanical, not a
# preference.
#
# HealthCheckServiceInstanceListSupplier builds its probe URL as
# (instance URI) + (health path). The instance URI carries the port a service
# registered with Eureka — its APPLICATION port. Step 2 moved /actuator/health to
# the management port, so every background poll would get a 404, every instance
# would be classed DOWN, and the gateway would answer 503 on every route. The
# path is configurable; the port is not.
#
# Enable it (delete the leading '#' on the three lines below) once one of these
# is true:
#   a. the services keep Actuator on their application port and only the EDGE
#      gets a separate management port — the split then costs nothing and this
#      configuration works unchanged; or
#   b. the management port is made reachable at the instance URI from the
#      gateway's network (port-forward, sidecar, or a Service that maps it).
#
#spring.cloud.loadbalancer.configurations=health-check
#spring.cloud.loadbalancer.health-check.interval=15s
#spring.cloud.loadbalancer.health-check.path.default=/actuator/health
#
# The alternative — each instance reporting its own health into Eureka — is
# deliberately NOT enabled either. EurekaHealthCheckHandler maps every non-UP
# status to DOWN, so billing-service's LAGGING (behind, still serving) would be
# published as DOWN and the gateway would stop routing to a service that was
# working. That would undo the ruling on LAGGING, from a different direction.
#eureka.client.healthcheck.enabled=true

# ---------------------------------------------------------------------------
# System health aggregator (specs/005-observability-resilience.md, step 5)
# ---------------------------------------------------------------------------
# How to reach a service's management port, given the application port Eureka
# registered. Step 2 moved Actuator off the application port, so /actuator/health
# on the registered port is a 404 — a probe has to add this offset.
#
# +10000 is right for this host and wrong in a pod, where every service runs with
# MGMT_PORT=8081. Publish `eureka.instance.metadata-map.management-port` from a
# service and the aggregator prefers it over this offset; otherwise set
# MGMT_PORT_OFFSET per environment.
gateway.health.management-port-offset=${MGMT_PORT_OFFSET:10000}
# Two seconds each. A fan-out is only as fast as its worst member, and an
# aggregation that hangs is an aggregation that is missing exactly when it is
# needed.
gateway.health.connect-timeout-ms=2000
gateway.health.response-timeout-ms=2000
