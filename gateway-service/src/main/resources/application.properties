spring.application.name=gateway-service
server.port=8888
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/ecom-bank
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/ecom-bank/protocol/openid-connect/certs
