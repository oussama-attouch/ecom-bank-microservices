spring.application.name=gateway-service
server.port=8888
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/ecom-bank
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/ecom-bank/protocol/openid-connect/certs

# ---------------------------------------------------------------------------
# Backoffice (specs/002-backoffice.md)
# ---------------------------------------------------------------------------
# Off by default. With the flag off, BackofficeUserController and
# KeycloakAdminClient are never created, /backoffice/** has no handler (so a
# manager gets 404, and everyone else is stopped at 403 by SecurityConfig), and
# no credential is read at all.
#
# Turning the flag on without a secret fails startup on purpose: an admin
# surface that starts broken answers 500 on every call and reads as a bug.
backoffice.users.enabled=false
backoffice.keycloak.base-url=http://localhost:8180
backoffice.keycloak.realm=ecom-bank
backoffice.keycloak.client-id=ecom-backoffice
# Dev-only credential, kept in step with keycloak/realm-export.json. Override
# with BACKOFFICE_KEYCLOAK_CLIENT_SECRET outside local development; this value
# is committed, so it must never be a production secret.
backoffice.keycloak.client-secret=
