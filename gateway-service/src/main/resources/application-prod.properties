# ---------------------------------------------------------------------------
# prod — deployed profile (Render + Keycloak on Render). The default profile
# still points at http://localhost:8180 for local dev; everything here comes
# from the environment.
# ---------------------------------------------------------------------------

# Keycloak is its own Render service, so the realm URL is a deploy-time fact.
# issuer-uri alone is almost enough — Spring derives the JWK set from the
# realm's discovery document — but the explicit jwk-set-uri is kept because it
# is what application.properties already declares, and the fallback path does
# not depend on Keycloak's discovery endpoint answering during a cold start.
#
# Note the failure mode: with issuer-uri set, Spring validates the issuer at
# startup and fetches the JWK set eagerly. If Keycloak is still cold when this
# service boots, the gateway exits rather than retrying. Recovery is a manual
# restart of this service after Keycloak reports healthy.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs

# Render's free plan cuts a request off at 100s. The gateway's own timeout is
# set below that so a slow downstream service produces a gateway timeout with a
# body, rather than a connection killed by the platform.
spring.cloud.gateway.httpclient.response-timeout=90s
spring.cloud.gateway.httpclient.connect-timeout=10s

# ---------------------------------------------------------------------------
# Registry
# ---------------------------------------------------------------------------
# Same hostname/HTTPS block as the other services: this one registers itself and
# is the reason the others' registrations have to be reachable by name — the
# gateway routes by service id, and a registration advertising a container IP
# is a route that resolves to nothing.
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME}
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE}
