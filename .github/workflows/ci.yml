name: CI

# Runs on every pull request into main and on every push to main. The two jobs
# are independent, so a slow backend test run does not hold up the frontend
# signal and a frontend lint failure cannot hide a broken Maven build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this pipeline only reads the repository. Nothing here needs
# to write a tag, comment on a PR, or push an image.
permissions:
  contents: read

# A new push to the same branch supersedes the run already in flight. Keeps the
# queue short without cancelling anything on a different ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.m2 between runs, keyed on the pom files.
          cache: maven

      # `verify` builds all eight modules in reactor order and runs the unit
      # tests. The suite is hermetic: no service needs Postgres, Kafka, Keycloak
      # or Eureka at test time. ledger-service has no @SpringBootTest at all,
      # and the other services import their config server with the `optional:`
      # prefix, so an absent Config Server degrades instead of failing.
      - name: Build and test all modules
        run: mvn -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ecom-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecom-frontend/package-lock.json

      # `npm ci` installs exactly what the lock file pins and fails if
      # package.json and the lock file have drifted apart.
      - name: Install dependencies
        run: npm ci

      # Karma needs a browser. The runner image ships Chrome, and
      # ChromeHeadless runs it without a display.
      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # The production configuration enforces the bundle-size budgets declared
      # in angular.json, so a grow-out-of-control asset fails here rather than
      # in review.
      - name: Production build
        run: npm run build
