global.params.p1=555
global.params.p2=777

spring.h2.console.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
# Actuator exposure. Was "*", which is why this line matters more than it looks:
# a Config Server property source OUTRANKS the service's own
# application.properties, so every service importing this file (customer,
# inventory, billing, order) was serving /actuator/heapdump, /actuator/env,
# /actuator/configprops and /actuator/loggers to anyone who could reach the port.
# The last two are write-capable — POST /actuator/loggers sets any logger level,
# and a heap dump is a credential-extraction primitive rather than an information
# leak. None of the four is needed by Prometheus, by a probe, or by a dashboard,
# so the allow-list is the whole surface. See
# specs/005-observability-resilience.md.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# H2 resilience: keep in-memory DBs alive across connection-pool churn (default pool size is 10)
spring.datasource.hikari.maximum-pool-size=20
