global.params.p1=6
global.params.p2=6

spring.h2.console.enabled=true
#spring.cloud.discovery.enabled=true
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.instance.prefer-ip-address=true
# Allow-list, not "*" — same reasoning as config-repo/application.properties and
# specs/005-observability-resilience.md: this value outranks
# order-service/src/main/resources/application.properties, so leaving it at "*"
# would reopen heapdump/env/configprops/loggers whatever the service file says.
#
# `circuitbreakers` is added here rather than only in the service's own file for
# exactly that precedence reason: the Config Server property source wins, so
# editing the service file alone left /actuator/circuitbreakers answering 404
# even though the list there named it. Read-only endpoint, and it is how an
# operator answers "is orderEnrichment open, and why" without scraping
# Prometheus.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
spring.datasource.url=jdbc:h2:mem:orders-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
