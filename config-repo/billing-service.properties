spring.datasource.url=jdbc:h2:mem:bills-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.data.rest.base-path=/api

# Exposed so the gateway's /api/admin/circuit-breakers can see the
# ledgerLiveStream breaker. The registry is per-JVM, and billing-service is one of
# only two services with a real breaker — without this line the dashboard's middle
# table would silently omit half the breakers in the fleet and still look complete.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
