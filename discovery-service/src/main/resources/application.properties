spring.application.name=discovery-service
# Render assigns the listening port through PORT at runtime and fails the deploy
# with "no open ports detected" if the process binds anything else. The literal
# after the colon is the local-development default, so nothing changes off Render.
server.port=${PORT:8761}
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

# The registry answers clients with whatever each instance registered, and this
# is the switch that decides what a service registers about itself. With it on,
# Eureka publishes the instance's IP; with it off, the hostname. On Render the
# IP is a container-local 172.x address that resolves to nothing from any other
# service, so every registration would be unusable for cross-service routing —
# the gateway would route to a dead address. Locally the default false is also
# correct: docker-compose and the IDE all run on one host, where a hostname
# resolves fine and an IP is only marginally faster.
eureka.instance.prefer-ip-address=false
