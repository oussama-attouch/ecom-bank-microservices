spring.application.name=discovery-service
server.port=8761
# Register the registry with itself. `false` is the Spring Cloud default for a
# Eureka server, and it is why the dashboard listed 7 services instead of 8:
# nothing filtered discovery-service out, it was never in the registry to begin
# with. With this on, the one component whose failure breaks every other one
# finally appears in the fleet view and is probed like everything else.
# fetch-registry stays false — it has no reason to read back what it owns.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=false

# ---------------------------------------------------------------------------
# Actuator / Micrometer (specs/005-observability-resilience.md)
# ---------------------------------------------------------------------------
# Allow-list, never "*": heapdump/loggers/env/configprops are excluded on purpose
# (heapdump and loggers are write-capable, and neither Prometheus nor a probe
# needs them). Details need an authorised principal; with no Spring Security on
# the classpath that resolves to "never", so HEALTH_SHOW_DETAILS=always opts in
# locally. This service had no Actuator at all before, so it had no health
# endpoint for ServiceHealthChecker to poll.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.info.env.enabled=true
info.app.name=${spring.application.name}
# Buckets, not client-side percentiles: percentiles cannot be pooled across
# instances, histogram buckets can (histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s

# ---------------------------------------------------------------------------
# Distributed tracing (specs/006-distributed-tracing-log-aggregation.md)
# ---------------------------------------------------------------------------
# 100% sampling is a DEMO setting: every request is also a trace, which is the
# point of the exercise, and it is not what a production deployment ships.
# Override with TRACING_SAMPLING_PROBABILITY (0.1 is a sane production start)
# without touching code. The decision is made once at the root and travels in
# the trace context, so a child service cannot sample a trace its parent dropped.
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# Zipkin's API path, not its UI URL: the collector is at /api/v2/spans while the
# UI is at /zipkin. Pointing this at :9411/zipkin drops every export with a 404
# that surfaces only as an empty trace list.
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# W3C Trace Context is what this stack produces (`traceparent`). B3 is consumed
# too, so a caller from the B3 ecosystem joins this trace instead of starting a
# second one; extraction tries W3C first, then B3 single, then B3 multi.
management.tracing.propagation.produce=W3C
management.tracing.propagation.consume=W3C,B3,B3_MULTI

# ---------------------------------------------------------------------------
# Log correlation (specs/006-distributed-tracing-log-aggregation.md)
# ---------------------------------------------------------------------------
# One pattern for all eight services. The only new fields are traceId and
# spanId, read from the MDC entry Micrometer Tracing fills in (with the OTel
# bridge, through Slf4JEventListener) — no code passes them along. The brackets
# and the comma are a contract, not decoration: Grafana's derived field matches
# [traceId,spanId], and LogQL greps the same id, so changing the shape breaks
# both.
#
# `:-` keeps startup and scheduled-job lines honest: outside a trace the field
# renders empty rather than the string "null".
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
# The file appender is what Promtail tails, because the eight JVMs run on the
# host while Promtail runs in the compose network. Same pattern, so a line is
# identical whichever path it took, and the rolled-file name still ends in .log
# so Promtail's *.log glob keeps matching after rotation. LOG_DIR exists
# because the working directory differs between `mvn spring-boot:run` (the
# module directory) and a jar started from the repo root; docker-compose mounts
# <repo>/logs, so start the services from the repo root or set LOG_DIR.
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
logging.file.name=${LOG_DIR:logs}/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log

# ---------------------------------------------------------------------------
# Kubernetes probes (specs/005-observability-resilience.md, step 2)
# ---------------------------------------------------------------------------
# Management traffic gets its own listener, so /actuator/** is not reachable
# through the port that serves business traffic. Default is app port + 10000 so
# the eight services do not collide on one developer host; a pod-per-service
# deployment sets MGMT_PORT=8081 in every manifest instead.
app.management-port=${MGMT_PORT:18761}
management.server.port=${app.management-port}
# Published so the gateway's health aggregator probes the port this service
# actually bound. One source of truth above: the server and Eureka cannot drift.
# Bracket notation preserves the dot — a plain metadata-map.management-port binds
# the key "management-port", so the aggregator reads both spellings.
eureka.instance.metadata-map[management.port]=${app.management-port}
management.endpoint.health.probes.enabled=true
# Liveness must not depend on an external system. A failing dependency cannot be
# fixed by a restart, and a restart destroys a pod that was still serving.
management.endpoint.health.group.liveness.include=livenessState,ping
# Readiness may fail, and that is the point: it keeps traffic off a pod that
# cannot serve. No database here — a registry is ready once its state is live.
management.endpoint.health.group.readiness.include=readinessState