# ---------------------------------------------------------------------------
# prod — deployed profile (Render + Aiven). Nothing here is read locally: the
# default profile is what docker-compose and the IDE use, and every value below
# is either an environment variable or a hardening change that only matters on
# a cold-starting free tier.
# ---------------------------------------------------------------------------

# Durable event store on Aiven Postgres. Aiven terminates TLS and requires
# sslmode=require in the JDBC URL; without it the driver is refused rather than
# redirected. The URL, user and password have no local fallback on purpose:
# activating this profile without them must fail loudly at startup, not silently
# connect to a developer's localhost:5433.
spring.datasource.url=${LEDGER_DB_URL}
spring.datasource.username=${LEDGER_DB_USER}
spring.datasource.password=${LEDGER_DB_PASSWORD}

# A free-tier database can still be coming up when this process is already
# accepting connections, and Flyway runs before the web server finishes
# starting. Ten retries five seconds apart turns "connection refused" during
# that window into a slower boot instead of a crash loop.
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5s

# ---------------------------------------------------------------------------
# Kafka — deliberately absent
# ---------------------------------------------------------------------------
# No spring.kafka.* here, and none in render.yaml either: this deployment has no
# broker. Both producer factories in the stack — this service's
# KafkaProducerConfig and billing-service's KafkaConsumerConfig.producerFactory —
# put bootstrap.servers into their own Properties map and never read
# spring.kafka.*, so pointing them at Aiven would open a PLAINTEXT connection to
# a SASL_SSL endpoint. The archive is fed over HTTP by the saga's notification
# instead (LEDGER_PUBLISHER=http, pinned in render.yaml), which is why the
# Archived Transactions page still fills.
#
# Kafka becomes mandatory again with the DLT consumer milestone. Wiring SASL into
# those two producer factories belongs to that work, not here — see
# README-DEPLOY.md Step 2.

# ---------------------------------------------------------------------------
# Registry
# ---------------------------------------------------------------------------
# On Render each service is a separate public HTTPS hostname, so Eureka has to
# advertise that hostname instead of the container's private IP — the default
# prefer-ip-address=true in application.properties is what a caller inside the
# same Docker network wants and exactly what does not work here. RENDER_EXTERNAL_HOSTNAME
# is injected by Render.
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME}
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE}
