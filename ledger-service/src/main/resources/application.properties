spring.application.name=ledger-service
server.port=8085

# ---------------------------------------------------------------------------
# Shutdown and connection handling
# ---------------------------------------------------------------------------
# On SIGTERM, stop accepting new connections and let in-flight requests finish
# before the socket closes, waiting up to 30s. Without this a restart can cut a
# request mid-flight. It does NOT help with a process that is killed outright or
# orphaned while still alive — that holds the port regardless — so
# scripts/restart-ledger.ps1 clears the port explicitly before starting.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Drop idle keep-alive connections after 5s, so a stopped instance is not held
# open by a client that is still reusing a connection to it.
server.tomcat.connection-timeout=5000

# Discovery / registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# URL of the billing-service TransactionProcessor archive endpoint.
# When Kafka is introduced, this HTTP notification is replaced by a
# published event on the "transactions" topic consumed by billing-service.
ledger.billing-service-url=http://localhost:8083

# Publisher selection: http (default/fallback) or kafka (exactly-once)
ledger.publisher=http
ledger.kafka.bootstrap-servers=localhost:9092

# ---------------------------------------------------------------------------
# Live event stream (att/ossama/ledgerservice/observability)
# ---------------------------------------------------------------------------
# ws://localhost:8085/ws/events — a STOMP endpoint (no SockJS) that mirrors every
# instrumented ledger event to connected clients on /topic/events, batched into
# one frame every 100ms.
#
# Disabled by default, and "disabled" here means absent rather than idle: the
# endpoint, the broadcaster and the Kafka observation listener are all
# @ConditionalOnProperty beans, so with the flag off there is no handler mapping
# for /ws/events (the path 404s), no flush thread, and no consumer group
# registered against ledger-events. Enable with
#   --ledger.live-stream.enabled=true
# Only "true" and "false" are meaningful: the two broadcaster beans are exact
# complements on this key, so any other value fails the context at startup
# instead of quietly switching the stream off.
#
# The same flag gates POST /internal/live-events, which other services use to
# report observations of their own onto this stream (billing-service's archive is
# the one in use). With the flag off that path 404s as well, which is what a
# reporter pointed at a stream-less ledger should see.
ledger.live-stream.enabled=false

# Consumer-side Kafka settings, for the observation listener above. Stated
# explicitly rather than inherited from spring-kafka's defaults so the listener
# cannot start deserializing differently because another service in the stack
# changed a shared property. The producer side is configured in
# KafkaProducerConfig; this listener is the only consumer in this service.
spring.kafka.bootstrap-servers=${ledger.kafka.bootstrap-servers:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Start at the tail of the topic: this consumer reports what is happening now,
# and replaying a two-year backlog on first connect is not its job.
spring.kafka.consumer.auto-offset-reset=latest

# Scheduled service health watchdog (logs to ledger-service)
ledger.health-check.base-url=http://localhost
ledger.health-check.interval-ms=300000
ledger.health-check.initial-delay-ms=30000

# Demo hooks: destructive endpoints that deliberately break ledger invariants
# (currently POST /api/journal/test/inject-unbalanced). Disabled by default, so
# the routes are not registered at all and return 404. Enable for a manual test
# run only: --ledger.demo-hooks.enabled=true
ledger.demo-hooks.enabled=false

# Projection admin: POST /api/admin/projections/rebuild, which replays the whole
# event log and verifies the read models against it. Read-only — it truncates and
# writes nothing (there are no materialized read-model tables in this service to
# truncate) — but it folds the entire log into memory, so it is gated as an
# administrative operation rather than exposed to any caller. Disabled by default,
# so the route is not registered at all and returns 404. Enable with
# --ledger.projection-rebuild.enabled=true.
ledger.projection-rebuild.enabled=false

# Seed runner (att/ossama/ledgerservice/seed): writes backdated history on
# startup so a fresh database has a populated dashboard. Needs both the "seed"
# profile and this flag; the flag keeps an accidental profile activation from
# writing to a database nobody meant to seed.
#   --spring.profiles.active=seed --ledger.seed.enabled=true
# Mode "small" is a handful of customers over 90 days; "portfolio" is 500
# customers, ~1,100 accounts and ~40k transactions over 24 months, and is meant
# for a wiped database.
ledger.seed.enabled=false
ledger.seed.mode=small
# Portfolio size, so a reseed can be verified at a smaller scale without a
# rebuild. Defaults are the full dataset.
ledger.seed.customers=500
ledger.seed.transactions=40000

# Transactional outbox (att/ossama/ledgerservice/outbox): the saga's ARCHIVE step
# writes its step row and one outbox row in a single transaction instead of
# publishing to Kafka inline, so a broker outage can no longer lose an event the
# ledger has already posted. Disabled by default, and "disabled" means the bean
# is absent rather than idle: the flag selects between two exact complements on
# this key (the inline publisher, or the outbox writer), so any value other than
# "true"/"false" fails the context at startup instead of quietly picking a
# publication path. Enable for a demo run with
#   --ledger.outbox.enabled=true --ledger.publisher=kafka
# Both flags matter: the writer only enqueues, and the relay that publishes the
# rows needs the Kafka producer.
ledger.outbox.enabled=false

# Poller cadence and budget. fixedDelay, so a slow broker cannot stack runs; the
# backoff and the parking budget are what make PARKED mean "this event is
# genuinely bad" rather than "Kafka blipped". A parked row is never retried and
# never deleted — an operator reads it and decides.
ledger.outbox.poll-interval=5000
ledger.outbox.batch-size=50
ledger.outbox.max-attempts=10

# ---------------------------------------------------------------------------
# Durable event store (Postgres)
# ---------------------------------------------------------------------------
spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5433/ledger_db}
spring.datasource.username=${LEDGER_DB_USER:ledger}
spring.datasource.password=${LEDGER_DB_PASSWORD:ledger}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Postgres JIT is off for this service's connections, deliberately.
#
# The KPI aggregates are wide — they group the whole journal or the whole event
# log — which puts their estimated cost close to jit_above_cost, and when it
# trips, the planner spends about a second compiling a query that then runs in a
# fifth of that. Measured on the seeded 50,000-row ledger, the anomaly card's
# query went from 1.36s to 245ms with JIT off, and the Command Center's SLA is
# 500ms. JIT earns its compile time on queries that run for seconds; nothing this
# service issues does.
spring.datasource.hikari.connection-init-sql=SET jit = off

# ---------------------------------------------------------------------------
# Actuator and HTTP metrics
# ---------------------------------------------------------------------------
# The Command Center's fourth-row SLA card is fed by SlaMetricsService, not by
# these — a Micrometer counter is cumulative since JVM start and cannot answer
# "the last 24 hours". These are exposed alongside it so an operator can see the
# same traffic broken down by URI and status, and so the 500ms SLO bucket the
# card is built around is visible as a real histogram in /actuator/metrics.
#
# "prometheus" is in the exposure list as of specs/005-observability-resilience.md:
# micrometer-registry-prometheus is a dependency now, so the endpoint exists
# instead of 404ing. The list stays an allow-list — heapdump, loggers, env and
# configprops remain excluded, and the reasoning is in the spec.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Details carry the JDBC URL and the broker list, so no authorised principal means
# no details. This service has no spring-boot-starter-security on the classpath
# (AGENTS.md), so "when-authorized" resolves to "never" here — the fail-closed
# direction. HEALTH_SHOW_DETAILS=always opts in for local work; a probe only reads
# the HTTP status, so it is unaffected either way.
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.info.env.enabled=true
info.app.name=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s

# ---------------------------------------------------------------------------
# Kubernetes probes (specs/005-observability-resilience.md, step 2)
# ---------------------------------------------------------------------------
# Own listener for management traffic; app port + 10000 by default so the eight
# services do not collide on one developer host (a pod sets MGMT_PORT=8081).
# This also moves /actuator/health off 8085, so ServiceHealthChecker's own target
# list had to move with it.
app.management-port=${MGMT_PORT:18085}
management.server.port=${app.management-port}
# Published to Eureka so the gateway's aggregator probes the bound port. Without
# it the aggregator falls back to appPort + 10000, which is right on this host
# and wrong in a pod — see k8s/ledger-service.yaml, where MGMT_PORT=8081.
eureka.instance.metadata-map[management.port]=${app.management-port}
management.endpoint.health.probes.enabled=true
# Never an external system. A dead Postgres must not restart the JVM — and here
# it matters twice over: the event store is append-only, so a restart storm
# during an outage is pure churn.
management.endpoint.health.group.liveness.include=livenessState,ping
# Postgres is the one dependency without which this service cannot serve a single
# request. Kafka is not in this group: the ledger writes its own journal first
# and the ARCHIVE step compensates if publication fails, so a broker outage is a
# bounded business failure, not a reason to stop taking traffic.
management.endpoint.health.group.readiness.include=readinessState,db
