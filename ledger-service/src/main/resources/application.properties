spring.application.name=ledger-service
server.port=8085

# ---------------------------------------------------------------------------
# Shutdown and connection handling
# ---------------------------------------------------------------------------
# On SIGTERM, stop accepting new connections and let in-flight requests finish
# before the socket closes, waiting up to 30s. Without this a restart can cut a
# request mid-flight. It does NOT help with a process that is killed outright or
# orphaned while still alive — that holds the port regardless — so
# scripts/restart-ledger.ps1 clears the port explicitly before starting.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Drop idle keep-alive connections after 5s, so a stopped instance is not held
# open by a client that is still reusing a connection to it.
server.tomcat.connection-timeout=5000

# Discovery / registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# URL of the billing-service TransactionProcessor archive endpoint.
# When Kafka is introduced, this HTTP notification is replaced by a
# published event on the "transactions" topic consumed by billing-service.
ledger.billing-service-url=http://localhost:8083

# Publisher selection: http (default/fallback) or kafka (exactly-once)
ledger.publisher=http
ledger.kafka.bootstrap-servers=localhost:9092

# Scheduled service health watchdog (logs to ledger-service)
ledger.health-check.base-url=http://localhost
ledger.health-check.interval-ms=300000
ledger.health-check.initial-delay-ms=30000

# Demo hooks: destructive endpoints that deliberately break ledger invariants
# (currently POST /api/journal/test/inject-unbalanced). Disabled by default, so
# the routes are not registered at all and return 404. Enable for a manual test
# run only: --ledger.demo-hooks.enabled=true
ledger.demo-hooks.enabled=false

# Projection admin: POST /api/admin/projections/rebuild, which replays the whole
# event log and verifies the read models against it. Read-only — it truncates and
# writes nothing (there are no materialized read-model tables in this service to
# truncate) — but it folds the entire log into memory, so it is gated as an
# administrative operation rather than exposed to any caller. Disabled by default,
# so the route is not registered at all and returns 404. Enable with
# --ledger.projection-rebuild.enabled=true.
ledger.projection-rebuild.enabled=false

# Seed runner (att/ossama/ledgerservice/seed): writes backdated history on
# startup so a fresh database has a populated dashboard. Needs both the "seed"
# profile and this flag; the flag keeps an accidental profile activation from
# writing to a database nobody meant to seed.
#   --spring.profiles.active=seed --ledger.seed.enabled=true
# Mode "small" is a handful of customers over 90 days; "portfolio" is 500
# customers, ~1,100 accounts and ~40k transactions over 24 months, and is meant
# for a wiped database.
ledger.seed.enabled=false
ledger.seed.mode=small
# Portfolio size, so a reseed can be verified at a smaller scale without a
# rebuild. Defaults are the full dataset.
ledger.seed.customers=500
ledger.seed.transactions=40000

# ---------------------------------------------------------------------------
# Durable event store (Postgres)
# ---------------------------------------------------------------------------
spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5433/ledger_db}
spring.datasource.username=${LEDGER_DB_USER:ledger}
spring.datasource.password=${LEDGER_DB_PASSWORD:ledger}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Postgres JIT is off for this service's connections, deliberately.
#
# The KPI aggregates are wide — they group the whole journal or the whole event
# log — which puts their estimated cost close to jit_above_cost, and when it
# trips, the planner spends about a second compiling a query that then runs in a
# fifth of that. Measured on the seeded 50,000-row ledger, the anomaly card's
# query went from 1.36s to 245ms with JIT off, and the Command Center's SLA is
# 500ms. JIT earns its compile time on queries that run for seconds; nothing this
# service issues does.
spring.datasource.hikari.connection-init-sql=SET jit = off

# ---------------------------------------------------------------------------
# Actuator and HTTP metrics
# ---------------------------------------------------------------------------
# The Command Center's fourth-row SLA card is fed by SlaMetricsService, not by
# these — a Micrometer counter is cumulative since JVM start and cannot answer
# "the last 24 hours". These are exposed alongside it so an operator can see the
# same traffic broken down by URI and status, and so the 500ms SLO bucket the
# card is built around is visible as a real histogram in /actuator/metrics.
#
# "prometheus" is deliberately absent from the exposure list: it would 404,
# because micrometer-registry-prometheus is not a dependency of this service.
management.endpoints.web.exposure.include=health,info,metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s
