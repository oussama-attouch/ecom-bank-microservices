spring.application.name=order-service
server.port=8084
spring.config.import=optional:configserver:http://localhost:9999

# ---------------------------------------------------------------------------
# Actuator / Micrometer (specs/005-observability-resilience.md)
# ---------------------------------------------------------------------------
# Allow-list, never "*": heapdump/loggers/env/configprops are excluded on purpose
# (heapdump and loggers are write-capable, and neither Prometheus nor a probe
# needs them). Details need an authorised principal; with no Spring Security on
# the classpath that resolves to "never", so HEALTH_SHOW_DETAILS=always opts in
# locally. Stated here as well as in config-repo on purpose: a Config Server
# property source outranks this file, and a service must still be safe when the
# Config Server is unreachable (the import is optional).
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.info.env.enabled=true
info.app.name=${spring.application.name}
# Buckets, not client-side percentiles: percentiles cannot be pooled across
# instances, histogram buckets can (histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s

# ---------------------------------------------------------------------------
# Kubernetes probes (specs/005-observability-resilience.md, step 2)
# ---------------------------------------------------------------------------
# Own listener for management traffic; app port + 10000 by default so the eight
# services do not collide on one developer host (a pod sets MGMT_PORT=8081).
app.management-port=${MGMT_PORT:18084}
management.server.port=${app.management-port}
# Published to Eureka so the gateway's aggregator probes the bound port; one
# source of truth prevents the server and the advert from drifting.
eureka.instance.metadata-map[management.port]=${app.management-port}
management.endpoint.health.probes.enabled=true
# Never an external system. A dead database or an unreachable customer-service
# must not restart this JVM.
management.endpoint.health.group.liveness.include=livenessState,ping
# The database only. customer-service and inventory-service are deliberately NOT
# here: /fullOrder already degrades through its circuit breaker and answers a
# typed 503, so an outage there is a per-request fact, not a reason to take the
# whole pod out of rotation.
management.endpoint.health.group.readiness.include=readinessState,db

# ---------------------------------------------------------------------------
# Resilience4j (specs/005-observability-resilience.md, step 3)
# ---------------------------------------------------------------------------
# One instance name, "orderEnrichment", shared by the three patterns on
# getOrder(). One name means one set of state and one set of metrics for the
# whole fan-out: /fullOrder calls customer-service once and inventory-service
# once per line item, and an operator wants "is order enrichment healthy",
# not two partial answers.
#
# CIRCUIT BREAKER — CLOSED / OPEN / HALF_OPEN
#   CLOSED     : calls pass, the last 10 outcomes are recorded.
#   OPEN       : after 50% of >=5 recorded calls fail, calls are rejected for
#                10s without touching the network, so a dead customer-service
#                costs 0ms instead of a 5s timeout per request.
#   HALF_OPEN  : after 10s, 3 probe calls are permitted. If they succeed the
#                breaker closes; one failure re-opens it for another 10s. This is
#                what stops a recovering downstream from being stampeded by the
#                full traffic volume at the exact moment it comes back.
resilience4j.circuitbreaker.instances.orderEnrichment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderEnrichment.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderEnrichment.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderEnrichment.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.orderEnrichment.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderEnrichment.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderEnrichment.automatic-transition-from-open-to-half-open-enabled=true
# A 404 from customer-service is a correct answer about a missing customer, not a
# health signal about the service. Counting it would open the breaker because
# someone asked for an order whose customer was deleted.
resilience4j.circuitbreaker.instances.orderEnrichment.ignore-exceptions=feign.FeignException$FeignClientException,java.util.NoSuchElementException

# RETRY — exponential backoff on transient failures only
#   3 attempts: the first call plus two retries. Delays are 500ms then 1000ms
#   (multiplier 2), so a request that is going to fail cannot occupy a worker for
#   longer than 1.5s of waiting plus the call timeouts.
#   A positive list, not an ignore-list: only these classes retry, so a 4xx is
#   excluded by construction. NOTE the exception type — this path is Feign, so a
#   4xx arrives as FeignException.FeignClientException. HttpClientErrorException
#   is the RestTemplate equivalent and can never occur here; naming it would
#   compile, read correctly, and silently retry 4xx forever.
resilience4j.retry.instances.orderEnrichment.max-attempts=3
resilience4j.retry.instances.orderEnrichment.wait-duration=500ms
resilience4j.retry.instances.orderEnrichment.enable-exponential-backoff=true
resilience4j.retry.instances.orderEnrichment.exponential-backoff-multiplier=2
resilience4j.retry.instances.orderEnrichment.retry-exceptions=io.github.resilience4j.bulkhead.BulkheadFullException,io.github.resilience4j.circuitbreaker.CallNotPermittedException,java.io.IOException,feign.RetryableException

# BULKHEAD — semaphore, 20 concurrent enrichments
#   Bounds the fan-out so a slow customer-service cannot occupy every Tomcat
#   worker: requests beyond 20 are rejected in 0ms and answered with the same
#   typed 503, which is a fast failure rather than a thread sitting on a socket.
resilience4j.bulkhead.instances.orderEnrichment.max-concurrent-calls=20
resilience4j.bulkhead.instances.orderEnrichment.max-wait-duration=0

# Every one of the three emits Micrometer meters, so
# resilience4j_circuitbreaker_state / _calls_total / _failure_rate and
# resilience4j_retry_calls_total reach /actuator/prometheus with no extra wiring.
resilience4j.circuitbreaker.metrics.enabled=true
resilience4j.retry.metrics.enabled=true
resilience4j.bulkhead.metrics.enabled=true