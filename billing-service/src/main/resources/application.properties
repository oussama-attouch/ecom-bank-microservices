spring.application.name=billing-service
# Render assigns the listening port through PORT at runtime and fails the deploy
# with "no open ports detected" if the process binds anything else. The literal
# after the colon is the local-development default, so nothing changes off Render.
server.port=${PORT:8083}
spring.config.import=optional:configserver:http://localhost:9999
spring.cloud.config.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=billing-service

# ---------------------------------------------------------------------------
# Live event stream reporting (att/ossama/billingservice/observability)
# ---------------------------------------------------------------------------
# When enabled, each transaction this service archives is reported to
# ledger-service's live event stream, where it appears with source
# "billing-consumer" alongside the ledger's own events. The stream itself is
# served by ledger-service and is off unless ledger.live-stream.enabled=true
# there — the two flags are independent, and this one alone changes nothing
# visible.
#
# Off by default: the report is an outbound HTTP call on the consume path, and a
# service that archives ledger events should not acquire a dependency on an
# observability endpoint unless someone asked for it. The call is best-effort
# with a 500ms connect / 1s read timeout and swallows every failure, so turning
# it on cannot stop an archive or cause a redelivery.
billing.live-stream.enabled=false
billing.live-stream.ledger-url=http://localhost:8085
