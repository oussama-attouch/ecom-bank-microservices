spring.application.name=billing-service
server.port=8083
spring.config.import=optional:configserver:http://localhost:9999
spring.cloud.config.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=billing-service

# ---------------------------------------------------------------------------
# Dead-letter consumer (att/ossama/billingservice/kafka/DltKafkaConsumerConfig)
# ---------------------------------------------------------------------------
# Its own group, deliberately not inheriting spring.kafka.consumer.group-id:
# DLT offsets must not mix into the archive consumer's commit history, so a
# stall on ledger-events.DLT cannot slow archive consumption, and DLT lag stays
# observable per group in Kafdrop / kafka-consumer-groups.
spring.kafka.consumer.dlt-group-id=billing-service-dlt

# ---------------------------------------------------------------------------
# Live event stream reporting (att/ossama/billingservice/observability)
# ---------------------------------------------------------------------------
# When enabled, each transaction this service archives is reported to
# ledger-service's live event stream, where it appears with source
# "billing-consumer" alongside the ledger's own events. The stream itself is
# served by ledger-service and is off unless ledger.live-stream.enabled=true
# there — the two flags are independent, and this one alone changes nothing
# visible.
#
# Off by default: the report is an outbound HTTP call on the consume path, and a
# service that archives ledger events should not acquire a dependency on an
# observability endpoint unless someone asked for it. The call is best-effort
# with a 500ms connect / 1s read timeout and swallows every failure, so turning
# it on cannot stop an archive or cause a redelivery.
billing.live-stream.enabled=false
billing.live-stream.ledger-url=http://localhost:8085

# ---------------------------------------------------------------------------
# Actuator / Micrometer (specs/005-observability-resilience.md)
# ---------------------------------------------------------------------------
# Allow-list, never "*": heapdump/loggers/env/configprops are excluded on purpose
# (heapdump and loggers are write-capable, and neither Prometheus nor a probe
# needs them). Details need an authorised principal; with no Spring Security on
# the classpath that resolves to "never", so HEALTH_SHOW_DETAILS=always opts in
# locally. Stated here as well as in config-repo on purpose: a Config Server
# property source outranks this file, and a service must still be safe when the
# Config Server is unreachable (the import is optional).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.info.env.enabled=true
info.app.name=${spring.application.name}
# Buckets, not client-side percentiles: percentiles cannot be pooled across
# instances, histogram buckets can (histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s

# ---------------------------------------------------------------------------
# Distributed tracing (specs/006-distributed-tracing-log-aggregation.md)
# ---------------------------------------------------------------------------
# 100% sampling is a DEMO setting: every request is also a trace, which is the
# point of the exercise, and it is not what a production deployment ships.
# Override with TRACING_SAMPLING_PROBABILITY (0.1 is a sane production start)
# without touching code. The decision is made once at the root and travels in
# the trace context, so a child service cannot sample a trace its parent dropped.
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# Zipkin's API path, not its UI URL: the collector is at /api/v2/spans while the
# UI is at /zipkin. Pointing this at :9411/zipkin drops every export with a 404
# that surfaces only as an empty trace list.
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# W3C Trace Context is what this stack produces (`traceparent`). B3 is consumed
# too, so a caller from the B3 ecosystem joins this trace instead of starting a
# second one; extraction tries W3C first, then B3 single, then B3 multi.
management.tracing.propagation.produce=W3C
management.tracing.propagation.consume=W3C,B3,B3_MULTI

# ---------------------------------------------------------------------------
# Log correlation (specs/006-distributed-tracing-log-aggregation.md)
# ---------------------------------------------------------------------------
# One pattern for all eight services. The only new fields are traceId and
# spanId, read from the MDC entry Micrometer Tracing fills in (with the OTel
# bridge, through Slf4JEventListener) — no code passes them along. The brackets
# and the comma are a contract, not decoration: Grafana's derived field matches
# [traceId,spanId], and LogQL greps the same id, so changing the shape breaks
# both.
#
# `:-` keeps startup and scheduled-job lines honest: outside a trace the field
# renders empty rather than the string "null".
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
# The file appender is what Promtail tails, because the eight JVMs run on the
# host while Promtail runs in the compose network. Same pattern, so a line is
# identical whichever path it took, and the rolled-file name still ends in .log
# so Promtail's *.log glob keeps matching after rotation. LOG_DIR exists
# because the working directory differs between `mvn spring-boot:run` (the
# module directory) and a jar started from the repo root; docker-compose mounts
# <repo>/logs, so start the services from the repo root or set LOG_DIR.
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
logging.file.name=${LOG_DIR:logs}/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log

# ---------------------------------------------------------------------------
# Kubernetes probes (specs/005-observability-resilience.md, step 2)
# ---------------------------------------------------------------------------
# Own listener for management traffic; app port + 10000 by default so the eight
# services do not collide on one developer host (a pod sets MGMT_PORT=8081).
app.management-port=${MGMT_PORT:18083}
management.server.port=${app.management-port}
# Published to Eureka so the gateway's aggregator probes the bound port; one
# source of truth prevents the server and the advert from drifting.
eureka.instance.metadata-map[management.port]=${app.management-port}
management.endpoint.health.probes.enabled=true
# Never an external system. Neither a dead database nor an unreachable broker may
# restart this JVM.
management.endpoint.health.group.liveness.include=livenessState,ping
# kafkaLag is here because a consumer that cannot reach the broker cannot do the
# one thing this service exists for. It still does NOT fail readiness when it
# reports LAGGING: that status is mapped to HTTP 200 below, and every health
# response — the endpoint and each group — goes through the same
# HttpCodeStatusMapper. A backlog drains on its own; pulling the pod cannot help
# it. Only DOWN (broker unreachable, not merely behind) turns this probe red.
management.endpoint.health.group.readiness.include=readinessState,db,kafkaLag

# ---------------------------------------------------------------------------
# Kafka consumer-lag health check (att/ossama/billingservice/observability)
# ---------------------------------------------------------------------------
# Group id -> lag (messages behind) above which the group reports LAGGING rather
# than UP. Both groups are auto-offset-reset=earliest, so a missing committed
# offset is counted as 0 rather than as the whole topic.
#
# The two thresholds differ for a reason: the archive group is a pipeline and a
# few hundred messages in flight is normal throughput, while billing-service-dlt
# should never hold anything at all — every message there is a poison message an
# operator has to read. 0 means "flag the moment one arrives".
#
# Disable with the Actuator-native switch, not a bespoke flag:
#   management.health.kafkaLag.enabled=false
billing.kafka-lag.groups.billing-service=500
billing.kafka-lag.groups.billing-service-dlt=0
# Sample freshness: the indicator serves the cached sample and refreshes in the
# background, so /actuator/health never blocks on a broker round trip.
billing.kafka-lag.cache-ttl=30s
billing.kafka-lag.admin-timeout=2s

# LAGGING has to be declared in the severity order, or it is silently dropped:
# the aggregate status is the lowest-index status present, and any status absent
# from this list sorts as least severe, so /actuator/health would answer "UP"
# while a component reported LAGGING. This replaces the built-in order, which is
# why DOWN/OUT_OF_SERVICE/UP/UNKNOWN are all restated here.
#
# Mapped to HTTP 200 on purpose: a backlog is not an outage, and a 503 here would
# page for a queue that is draining.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,LAGGING,UNKNOWN,UP
management.endpoint.health.status.http-mapping.LAGGING=200

# ---------------------------------------------------------------------------
# Resilience4j (specs/005-observability-resilience.md, step 3)
# ---------------------------------------------------------------------------
# Protects the outbound report to ledger-service's live event stream
# (ArchiveObservationNotifier). Its documented contract is "it must never
# matter", so the degraded outcome here is a no-op, not a 503 — a 503 would
# propagate into the Kafka listener and turn a telemetry failure into a
# redelivery of a record that was in fact archived.
#
# No Retry on this instance, and that is deliberate: the call is fire-and-forget
# telemetry with a 1.5s timeout budget, so three attempts would triple the load
# on a ledger that is already struggling, to deliver a notification nobody
# blocks on. The circuit breaker is the whole remedy.
resilience4j.circuitbreaker.instances.ledgerLiveStream.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ledgerLiveStream.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ledgerLiveStream.sliding-window-size=10
resilience4j.circuitbreaker.instances.ledgerLiveStream.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.ledgerLiveStream.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ledgerLiveStream.automatic-transition-from-open-to-half-open-enabled=true
# A 4xx from the ingest endpoint means this client is wrong, not that the ledger
# is unhealthy — retrying or opening on it would hide a real contract break.
resilience4j.circuitbreaker.instances.ledgerLiveStream.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
# Small: one notification per archived record, and the point is to shed load when
# the ledger is slow, not to queue behind it.
resilience4j.bulkhead.instances.ledgerLiveStream.max-concurrent-calls=5
resilience4j.bulkhead.instances.ledgerLiveStream.max-wait-duration=0
