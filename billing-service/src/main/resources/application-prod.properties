# ---------------------------------------------------------------------------
# prod — deployed profile (Render + Aiven).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Registry
# ---------------------------------------------------------------------------
# On Render each service is a separate public HTTPS hostname, so Eureka has to
# advertise that hostname rather than the container's private IP. This is the
# mirror image of the local default (prefer-ip-address=true in
# application.properties), which is what a caller inside one Docker network
# wants and what a caller across Render's network cannot use: an advertised
# 172.x address resolves to nothing outside the container it came from.
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME}
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE}

# ---------------------------------------------------------------------------
# Kafka — deliberately absent
# ---------------------------------------------------------------------------
# This service's consumer would read spring.kafka.* (unlike the ledger's
# producer, which is a hand-built ProducerFactory), so a SASL block here would
# work for consuming. It is still omitted, because this deployment has no broker
# and a half-configured Kafka is worse than none:
#
#   - the dead-letter producer in KafkaConsumerConfig.producerFactory sets
#     bootstrap.servers and no security properties, so a poison record cannot be
#     routed to ledger-events.DLT on Aiven — it would burn its three retries and
#     be logged;
#   - nothing publishes to ledger-events here anyway, because the ledger's
#     publisher is on the HTTP path (LEDGER_PUBLISHER=http, pinned in
#     render.yaml), and that HTTP notification is what fills the archive.
#
# Kafka becomes mandatory with the DLT consumer milestone, and SASL wiring for
# those producer factories belongs to that work — see README-DEPLOY.md Step 2.
